[package]
name = "codecrafters-claude-code"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
async-openai = { version = "=0.32.4", features = ["byot", "chat-completion"] }
clap = { version = "4.3.14", features = ["derive"] }
serde_json = "1.0.149"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
# Same version async-openai uses; lets us bound its 429 retries.
backoff = "0.4"
# Runs a turn's Task calls concurrently (bounded) while borrowing the parent's state.
futures-util = "0.3"

[dev-dependencies]
# Test-only mock model endpoint.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
